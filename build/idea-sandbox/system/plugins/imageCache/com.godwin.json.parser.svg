    <defs>
        <!-- Gem facet gradients - emerald shades -->
        <linearGradient id="gemTop" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#003300"/>
            <stop offset="100%" stop-color="#1B5E20"/>
        </linearGradient>
        <linearGradient id="gemLeftUpper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#2E7D32"/>
            <stop offset="100%" stop-color="#003300"/>
        </linearGradient>
        <linearGradient id="gemRightUpper" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#43A047"/>
            <stop offset="100%" stop-color="#1B5E20"/>
        </linearGradient>
        <linearGradient id="gemLeftLower" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#1B5E20"/>
            <stop offset="100%" stop-color="#002200"/>
        </linearGradient>
        <linearGradient id="gemCenter" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#66BB6A"/>
            <stop offset="100%" stop-color="#2E7D32"/>
        </linearGradient>
        <linearGradient id="gemRightLower" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#388E3C"/>
            <stop offset="100%" stop-color="#002200"/>
        </linearGradient>

        <!-- Bright emerald sparkle highlight -->
        <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#CCFF90" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#00E676" stop-opacity="0.35"/>
        </linearGradient>
    </defs>

    <!-- { left brace -->
    <path d="M28,8 C20,8 17,13 17,20 L17,42 C17,49 13,53 7,54 C13,55 17,59 17,66 L17,80 C17,87 20,92 28,92"
          fill="none" stroke="#6E6E6E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- } right brace -->
    <path d="M72,8 C80,8 83,13 83,20 L83,42 C83,49 87,53 93,54 C87,55 83,59 83,66 L83,80 C83,87 80,92 72,92"
          fill="none" stroke="#6E6E6E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- GEM — paths unchanged, full emerald palette -->
    <g transform="translate(50,52) scale(0.72) translate(-50,-52)">
        <polygon points="50,18 34,44 50,50 66,44" fill="url(#gemTop)"        stroke="#00E676" stroke-width="0.8"/>
        <polygon points="34,44 22,58 38,61 50,50" fill="url(#gemLeftUpper)"  stroke="#00C853" stroke-width="0.8"/>
        <polygon points="66,44 50,50 62,61 78,58" fill="url(#gemRightUpper)" stroke="#00E676" stroke-width="0.8"/>
        <line x1="22" y1="58" x2="78" y2="58" stroke="#00C853" stroke-width="0.8"/>
        <polygon points="22,58 38,61 43,80 50,88" fill="url(#gemLeftLower)"  stroke="#1B5E20" stroke-width="0.8"/>
        <polygon points="38,61 62,61 50,88"        fill="url(#gemCenter)"     stroke="#00E676" stroke-width="0.8"/>
        <polygon points="62,61 78,58 50,88 57,80"  fill="url(#gemRightLower)" stroke="#1B5E20" stroke-width="0.8"/>

        <!-- Internal facet lines -->
        <line x1="50" y1="18" x2="50" y2="88"   stroke="#69F0AE" stroke-width="0.6"/>
        <line x1="50" y1="50" x2="22" y2="58"   stroke="#00E676" stroke-width="0.6"/>
        <line x1="50" y1="50" x2="78" y2="58"   stroke="#00E676" stroke-width="0.6"/>
        <line x1="34" y1="44" x2="66" y2="44"   stroke="#69F0AE" stroke-width="0.6"/>

        <!-- Highlight sparkle -->
        <line x1="40" y1="23" x2="36" y2="33" stroke="url(#shineGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
        <line x1="35" y1="25" x2="32" y2="33" stroke="url(#shineGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    </g>
</svg>
