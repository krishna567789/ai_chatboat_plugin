<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16c79a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11d3bc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background chip -->
  <rect x="4" y="4" width="32" height="32" rx="2" fill="#1a1a2e" stroke="url(#gpuGrad)" stroke-width="2"/>
  
  <!-- GPU cores grid -->
  <rect x="10" y="10" width="8" height="8" fill="#16c79a" rx="1"/>
  <rect x="22" y="10" width="8" height="8" fill="#16c79a" rx="1"/>
  <rect x="10" y="22" width="8" height="8" fill="#16c79a" rx="1"/>
  <rect x="22" y="22" width="8" height="8" fill="#16c79a" rx="1"/>
  
  <!-- Connection lines -->
  <line x1="12" y1="14" x2="28" y2="14" stroke="#11d3bc" stroke-width="1.5"/>
  <line x1="12" y1="26" x2="28" y2="26" stroke="#11d3bc" stroke-width="1.5"/>
  <line x1="14" y1="12" x2="14" y2="28" stroke="#11d3bc" stroke-width="1.5"/>
  <line x1="26" y1="12" x2="26" y2="28" stroke="#11d3bc" stroke-width="1.5"/>
  
  <!-- Center highlight -->
  <circle cx="20" cy="20" r="2" fill="#11d3bc" opacity="0.8"/>
</svg>
