<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Um registro central que se ramifica em servidores: e o que o plugin faz, e le bem
    em 40px porque sao poucas formas, todas com o mesmo peso de traco.

    Tema claro. A variante escura e pluginIcon_dark.svg, com os mesmos caminhos.
  -->
  <g stroke="#6C707E" stroke-width="1.6" stroke-linecap="round">
    <path d="M9 13.5V32"/>
    <path d="M9 19h6.5"/>
    <path d="M9 25.5h6.5"/>
    <path d="M9 32h6.5"/>
  </g>

  <!-- O CMS: a instancia que guarda o cadastro. -->
  <rect x="2.5" y="4" width="21" height="9.5" rx="2.5" fill="#3574F0"/>
  <circle cx="7" cy="8.75" r="1.5" fill="#FFFFFF"/>

  <!-- As instancias registradas. -->
  <g fill="#DFE1E5" stroke="#6C707E" stroke-width="1.4">
    <rect x="16.5" y="16" width="21" height="6" rx="2"/>
    <rect x="16.5" y="22.5" width="21" height="6" rx="2"/>
    <rect x="16.5" y="29" width="21" height="6" rx="2"/>
  </g>
  <g fill="#6C707E">
    <circle cx="20.5" cy="19" r="1.2"/>
    <circle cx="20.5" cy="25.5" r="1.2"/>
    <circle cx="20.5" cy="32" r="1.2"/>
  </g>
</svg>
